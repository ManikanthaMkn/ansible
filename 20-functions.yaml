- name: functions
  hosts: local
  connections: local
  vars: 
    persons: "Ramesh, Suresh, Raheem, Joseph"
  tasks:
  - name: check undefined variables
    ansible.builtin.debug:
      msg: "Hello {{ person | default('Ramesh') }}"

  - name: print names
    ansible.builtin.debug:
      msg: "Hello {{ persons | split(',') }}"

