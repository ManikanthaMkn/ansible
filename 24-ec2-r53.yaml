- name: Create EC2 and R53 Records
  hosts: local
  connection: local
  vars:
    instances:
    - mysql
    - mongodb
    - frontend
    subnet_id: subnet-0df742a6734e610da
    sg_id: sg-0c515ae895f00d1b4
    zone: arohvya.online
  tasks:
  - name: Create EC2
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      vpc_subnet_id: "{{ subnet_id }}"
      instance_type: t3.micro
      security_group: "{{ sg_id }}"
      image_id: ami-0220d79f3f480ecf5
      tags:
        Name: "{{ item }}"
    loop: "{{ instances }}"
    register: ec2_output
  
  - name: Print EC2 Output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"

  - name: Create R53 Record
    amazon.aws.route53:
      state: present
      zone: "{{ zone }}"
      record: "{{ item.item }}.{{ zone }}"
      type: A
      ttl: 1
      value: "{{item.instances[0].private_ip_address}}"
      wait: true
      overwrite: true
    loop: "{{ ec2_output.results }}"

  - name: Create R53 Record
    amazon.aws.route53:
      state: present
      zone: "{{ zone }}"
      record: "{{ zone }}"
      type: A
      ttl: 1
      value: "{{item.instances[0].public_ip_address}}"
      wait: true
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: item.item == "frontend"