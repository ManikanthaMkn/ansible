- name: play level variables
  hosts: local
  connection: local
  vars:
    COURSE: Ansible
    DURATION: 10HRS
    TRAINER: Shiva
  tasks:
  - name: Print course information
    ansible.builtin.debug:
      msg: "Hello Course is: {{ COURSE }}, Course Duration: {{ DURATION }}, Trainer is: {{ TRAINER }}"

  - name: Print course information again
    ansible.builtin.debug:
      msg: "Course is: {{ COURSE }}, Course Duration: {{ DURATION }}, Trainer is: {{ TRAINER }}"